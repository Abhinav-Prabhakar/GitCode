<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GitCode - practice Git like a sport. Recover lost commits, resolve conflicts, rebase safely, and clean up history.">
  <title>GitCode · Practice Git</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GitCode">
  <meta property="og:image" content="https://abhinav-prabhakar.github.io/gitcode/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:title" content="GitCode · Practice Git">
  <meta property="og:description" content="Recover lost commits, untangle merges, rebase shared branches, bisect regressions. A LeetCode-style practice surface for Git.">
  <meta property="og:url" content="https://abhinav-prabhakar.github.io/gitcode/">
  <script>
    try {
      var forcedTheme = new URLSearchParams(location.search).get("theme");
      var savedTheme = forcedTheme || localStorage.getItem("gc-theme");
      if (savedTheme) {
        document.documentElement.classList.toggle("dark", savedTheme === "dark");
        document.documentElement.classList.toggle("light", savedTheme === "light");
        if (forcedTheme) localStorage.setItem("gc-theme", forcedTheme);
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/css/vendor/leetcode-base.css">
  <link rel="stylesheet" href="assets/css/vendor/leetcode-question.css">
  <link rel="stylesheet" href="assets/css/vendor/leetcode-extras.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div class="gc-app" data-page="dashboard">
    <header id="gc-nav"><!-- rendered by ui.js --></header>

    <main class="gc-ps" id="main-content">
      <div class="gc-ps__content">
        <div class="gc-banners gc-fade-x" id="gc-tracks"></div>

        <div class="gc-keywords" id="gc-keywords" aria-label="Popular tags"></div>

        <div class="gc-filterrow">
          <div class="gc-pills scrollbar-hide" id="gc-pills" role="tablist" aria-label="Task categories"></div>
          <button class="gc-pillsnav" type="button" id="gc-pills-nav" aria-label="More categories" hidden></button>
        </div>

        <div class="gc-listblock">
          <div class="gc-toolbar">
            <div class="gc-toolbar__left">
              <div class="gc-searchwrap">
                <input class="gc-searchinput" type="search" id="gc-search" data-search data-global-search
                       placeholder="Search tasks" aria-label="Search tasks" autocomplete="off">
                <span class="gc-searchwrap__icon" id="gc-search-icon"></span>
                <kbd class="gc-searchkbd">/</kbd>
              </div>

              <div class="gc-menu-anchor">
                <button class="gc-toolbtn" data-menu-button aria-label="Sort tasks" title="Sort">
                  <span id="gc-sort-icon"></span>
                </button>
                <div class="gc-menu" role="menu" hidden>
                  <div class="gc-menu__label">Sort by</div>
                  <button class="gc-menu__item" role="menuitemradio" data-sort="number" aria-checked="true">
                    <span class="check"></span>Number</button>
                  <button class="gc-menu__item" role="menuitemradio" data-sort="difficulty" aria-checked="false">
                    <span class="check"></span>Difficulty</button>
                  <button class="gc-menu__item" role="menuitemradio" data-sort="acceptance" aria-checked="false">
                    <span class="check"></span>Acceptance</button>
                  <button class="gc-menu__item" role="menuitemradio" data-sort="title" aria-checked="false">
                    <span class="check"></span>Title</button>
                </div>
              </div>

              <div class="gc-menu-anchor">
                <button class="gc-toolbtn" data-menu-button id="gc-status-button" aria-label="Filter tasks" title="Filter">
                  <span id="gc-status-icon"></span>
                  <span class="gc-toolbtn__dot" id="gc-status-dot" hidden></span>
                </button>
                <div class="gc-menu" role="menu" hidden>
                  <div class="gc-menu__label">Status</div>
                  <button class="gc-menu__item" role="menuitemradio" data-status="all" aria-checked="true">
                    <span class="check"></span>All statuses</button>
                  <button class="gc-menu__item" role="menuitemradio" data-status="solved" aria-checked="false">
                    <span class="check"></span>Solved</button>
                  <button class="gc-menu__item" role="menuitemradio" data-status="attempted" aria-checked="false">
                    <span class="check"></span>Attempted</button>
                  <button class="gc-menu__item" role="menuitemradio" data-status="todo" aria-checked="false">
                    <span class="check"></span>Not started</button>
                  <button class="gc-menu__item" role="menuitemradio" data-status="bookmarked" aria-checked="false">
                    <span class="check"></span>Bookmarked</button>
                </div>
              </div>

              <div class="gc-filterchip" id="gc-tag-filter" hidden></div>
            </div>

            <div class="gc-toolbar__right">
              <a class="gc-progress" href="index.html?status=solved" id="gc-progress"></a>
              <button class="gc-toolbtn gc-toolbtn--plain" data-tip="Pick a random task" id="gc-shuffle"
                      aria-label="Pick a random task"></button>
            </div>
          </div>

          <div class="gc-list" id="gc-list" role="list"></div>
          <div id="gc-empty"></div>
        </div>
      </div>

      <aside class="gc-ps__rail" id="gc-aside" aria-label="Daily challenge and trending commands"></aside>
    </main>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/progress.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
